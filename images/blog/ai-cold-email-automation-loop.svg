    <circle cx="1024.5" cy="305" r="13"/>
    <circle cx="1024.5" cy="495" r="13"/>
    <circle cx="860" cy="590" r="13"/>
    <circle cx="695.5" cy="495" r="13"/>
    <circle cx="695.5" cy="305" r="13"/>
  </g>
  <circle cx="860" cy="210" r="5" fill="#00b3d4"/>
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="2" fill="#eef3f5">
    <text x="860" y="176" text-anchor="middle">01 OFFER</text>
    <text x="1050" y="310">02 MESSAGING</text>
    <text x="1050" y="500">03 LEADS</text>
    <text x="860" y="636" text-anchor="middle">04 VERIFY</text>
    <text x="670" y="500" text-anchor="end">05 SEND</text>
