  </defs>
  <rect width="1200" height="800" fill="#0b0f12"/>
  <rect width="1200" height="800" fill="url(#d)"/>
  <circle cx="860" cy="400" r="190" fill="none" stroke="#00b3d4" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="860" cy="400" r="112" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="3 9"/>
  <path d="M-10 -8 L5 0 L-10 8" transform="translate(765 235.5) rotate(-30)" fill="none" stroke="#4fc9e6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M-10 -8 L5 0 L-10 8" transform="translate(955 564.5) rotate(150)" fill="none" stroke="#4fc9e6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0b0f12" stroke="#00b3d4" stroke-width="2.5">
